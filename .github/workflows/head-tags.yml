name: Site checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Assert title/description/canonical/og:url on every page
        run: python3 scripts/check_head_tags.py
      - name: Build Jekyll site
        run: bundle exec jekyll build --strict_front_matter
      - name: Check rendered navigation and structure
        run: ruby scripts/check_rendered_site.rb
