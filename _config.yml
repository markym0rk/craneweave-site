title: Craneweave
description: Expert coaching made effortless. Match with a vetted coach, follow a personalized plan, and get written reviews of your real work at a published monthly price.
url: "https://craneweave.com"
baseurl: ""
author: Craneweave

# Build settings
markdown: kramdown

# Plugins (whitelisted on GitHub Pages)
# jekyll-sitemap removed: sitemap.xml is hand-authored at repo root (only
# index.html has front matter, so the generated sitemap omitted 13 real pages).
# jekyll-seo-tag removed: no page calls {% seo %}, and leaving it armed would
# emit duplicate title/OG tags the first time a page gains front matter.
plugins:
  - jekyll-redirect-from

# Exclude from build
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - scripts
